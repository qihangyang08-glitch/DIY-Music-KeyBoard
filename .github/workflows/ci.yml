name: CI

on:
  push:
  pull_request:

jobs:
  pc-tests:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      PYTHONFAULTHANDLER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install desktop dependencies
        run: pip install -r pc/requirements.txt
      - name: Run unit tests
        shell: pwsh
        working-directory: pc
        run: |
          # Capture the full run so a failure can be surfaced as a check-run
          # annotation (the raw log needs repository admin rights via API).
          # cmd /c avoids PowerShell turning a native stderr write into a
          # terminating error before we can annotate the failure.
          $ErrorActionPreference = 'Continue'
          cmd /c "python -m unittest discover -s tests -v > unit-tests.log 2>&1"
          $code = $LASTEXITCODE
          $lines = @(Get-Content unit-tests.log)
          $lines
          if ($code -ne 0) {
            $matched = $false
            for ($i = 0; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -match '^(FAIL|ERROR):') {
                $matched = $true
                $message = $lines[$i]
                for ($j = 1; $j -le 6 -and ($i + $j) -lt $lines.Count; $j++) {
                  $message += " | " + $lines[$i + $j]
                }
                Write-Host "::error::$message"
              }
            }
            if (-not $matched) {
              $tail = ($lines | Select-Object -Last 40) -join " | "
              Write-Host "::error::no FAIL/ERROR lines; tail: $tail"
            }
            Write-Host "::error::test runner exit code $code"
          }
          exit $code

  firmware-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PlatformIO
        run: pip install platformio
      - name: Compile ESP32-S3 firmware (no upload)
        run: pio run -e esp32-s3-devkitc-1
