name: CI

on:
  push:
  pull_request:

jobs:
  pc-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install desktop dependencies
        run: pip install -r pc/requirements.txt
      - name: Run unit tests
        shell: pwsh
        working-directory: pc
        run: |
          # Capture the full run so a failure can be surfaced as a check-run
          # annotation (the raw log needs repository admin rights via API).
          $output = & python -m unittest discover -s tests -v 2>&1
          $code = $LASTEXITCODE
          $output | Tee-Object -FilePath unit-tests.log
          if ($code -ne 0) {
            $lines = @($output)
            for ($i = 0; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -match '^(FAIL|ERROR):') {
                $message = $lines[$i]
                for ($j = 1; $j -le 5 -and ($i + $j) -lt $lines.Count; $j++) {
                  $message += " | " + $lines[$i + $j]
                }
                Write-Host "::error::$message"
              }
            }
            Write-Host "::error::$code test runner exit code"
          }
          exit $code

  firmware-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PlatformIO
        run: pip install platformio
      - name: Compile ESP32-S3 firmware (no upload)
        run: pio run -e esp32-s3-devkitc-1
