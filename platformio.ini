; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; With more than one env in this file, a bare `pio run -t upload` would flash
; every env in turn — and whichever one is last wins. Pin the default so the
; main firmware is what a plain `pio run -t upload` (or the VS Code Upload
; button) actually installs. The addr-probe env is opt-in via `-e`.
[platformio]
default_envs = esp32-s3-devkitc-1

; IMPORTANT: everything shared belongs in THIS section. An [env:...] header
; claims every line after it, so any setting written below another env's header
; silently stops applying to this one — that is how ARDUINO_USB_CDC_ON_BOOT
; once got lost and left `Serial` on UART0. Keep the extra envs LAST.
[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1      ; board definition assumes the N8 (8 MB) variant...
framework = arduino

; addr_probe.cpp is a second, self-contained firmware with its own setup()/
; loop(); it is built only by the addr-probe env below.
build_src_filter = +<*> -<addr_probe.cpp>

; ...but this particular board reports 16 MB of flash (ESP.getFlashChipSize()
; == 16 MB on the serial banner). Give it the matching partition table so we
; aren't wasting half the chip.
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

; The platform pins esptool 4.5.1, whose only post-upload reset over the
; USB-Serial/JTAG peripheral is a no-op RTS pulse (the peripheral's DTR/RTS
; lines are not wired to EN/GPIO0 on this board), so the chip was left sitting
; in ROM download mode after every upload. esptool 4.9.0 added
; `--after watchdog_reset`, a register-driven RTC watchdog reset that does
; re-sample the strapping pins and therefore boots the app. Bump just the
; toolchain package rather than the whole platform: 6.10.0's builder already
; honours board_upload.after_reset.
platform_packages =
    platformio/tool-esptoolpy@~2.40900.0
board_upload.after_reset = watchdog_reset

monitor_speed = 115200
; Stop the monitor toggling DTR/RTS, so opening it never resets the board.
monitor_dtr = 0
monitor_rts = 0

; The board definition already sets ARDUINO_USB_MODE=1, which selects the
; ESP32-S3 built-in "USB Serial/JTAG" peripheral (HWCDC). That is the mode
; where esptool's automatic reset-into-bootloader works, so uploading never
; needs the BOOT button held. (USB_MODE=0 would select USB-OTG/TinyUSB, which
; disconnects the USB-Serial/JTAG peripheral while the app runs — we may move
; there later if we ever want a real USB-MIDI class device.)
;
; ARDUINO_USB_CDC_ON_BOOT=1 routes the Arduino `Serial` object to that USB
; port instead of to UART0 on GPIO43/44.
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CORE_DEBUG_LEVEL=3

; ---------------------------------------------------------------------------
; Standalone MPR121 address-strap probe (src/addr_probe.cpp).
;
; A second, deliberately tiny firmware for one job: prove that shorting ADD to
; another pin really moved the chip's I2C address, and that the module still
; senses afterwards. PlatformIO has no per-env source directory, so the two
; firmwares are separated with build_src_filter — the probe env builds
; addr_probe.cpp only, and the default env builds everything else.
;
;   pio run -e addr-probe -t upload
;
; Remember the chip latches its address only at power-on: power-cycle after
; every ADD wiring change, or the probe is measuring the previous strap.
[env:addr-probe]
extends = env:esp32-s3-devkitc-1
build_src_filter = +<*> -<main.cpp> -<mpr121.cpp>
